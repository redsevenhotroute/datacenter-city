<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Center City</title>
<meta name="description" content="A tiny SimCity where you zone data centers. Pick a side: I love data centers, or I hate data centers.">
<meta property="og:title" content="Data Center City"><meta property="og:description" content="Zone data centers. Manage the grid, the water and the Town Hall. Pick a side.">
<meta name="twitter:card" content="summary">
<style>
body{margin:0;font:14px/1.35 -apple-system,system-ui,sans-serif;background:#1d2a1f;color:#eee}
header{padding:10px 12px;background:#111;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header b{font-size:16px}.stat{background:#222;padding:4px 8px;border-radius:6px}
#tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}
#tools button{border:0;border-radius:6px;padding:8px 10px;font-weight:600;cursor:pointer}
#tools button.on{outline:3px solid #fff}
#grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:8px 12px;max-width:640px}
.c{aspect-ratio:1;background:#3b5d3a;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;user-select:none}
#ticker{margin:6px 12px 0;max-width:616px;background:#111;border-left:4px solid #fc6;padding:8px 10px;border-radius:4px;min-height:36px;font-size:13px}
#ticker.bad{border-color:#e55;color:#fcc}
#log{padding:8px 12px;max-width:640px;font-size:13px;color:#cfc}#log div{margin:2px 0}
.bad{color:#f99}.meter{height:8px;background:#333;border-radius:4px;width:120px;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:#e55;border-radius:4px}
</style></head><body>
<header><b>🏙️ Data Center City</b>
<span class="stat">💰 $<span id="cash"></span>M</span>
<span class="stat">📈 Tax/yr $<span id="tax"></span>M</span>
<span class="stat">👥 Pop <span id="pop"></span></span>
<span class="stat">⚡ Grid <span id="pw"></span></span>
<span class="stat">💧 Water <span id="wt"></span></span>
<span class="stat">🧾 Resident power bill <span id="bill"></span></span>
<span class="stat">📣 Town Hall anger <span class="meter"><i id="anger"></i></span></span>
<span class="stat">🏫 Schools funded <span id="sch"></span></span>
<span class="stat">📅 Year <span id="yr"></span></span>
<button id="mode" style="padding:6px 12px;font-weight:700">❤️ I love data centers</button>
<button id="next" style="padding:6px 12px;font-weight:700">Next year ▶</button>
</header>
<div id="ticker"></div>
<div id="tools"></div>
<div id="grid"></div>
<div id="log"></div>
<script>
const T={
 res:{e:'🏠',n:'Homes',cost:2,tax:0.3,pop:120,pw:-1,wt:-1,col:'#7c6'},
 shop:{e:'🏪',n:'Shops',cost:3,tax:0.6,pop:0,pw:-1,wt:0,col:'#6ad'},
 ind:{e:'🏭',n:'Heavy industry',cost:5,tax:1.2,pop:0,pw:-3,wt:-2,col:'#a86',smog:1},
 dc:{e:'🖥️',n:'Data center',cost:40,tax:9,pop:0,pw:-12,wt:-4,col:'#88f',jobs:30},
 gas:{e:'🔥',n:'Gas plant',cost:20,tax:0.5,pop:0,pw:20,wt:-3,col:'#c75',smog:1},
 sol:{e:'☀️',n:'Solar farm',cost:25,tax:0.2,pop:0,pw:10,wt:0,col:'#dc4'},
 nuke:{e:'⚛️',n:'Nuclear plant',cost:120,tax:2,pop:0,pw:60,wt:-6,col:'#9c9'},
 wtr:{e:'🚰',n:'Water plant',cost:10,tax:0,pop:0,pw:-1,wt:15,col:'#4bd'},
 park:{e:'🌳',n:'Park',cost:1,tax:0,pop:0,pw:0,wt:0,col:'#3a3',calm:1},
 bull:{e:'🚜',n:'Bulldoze',cost:0}
};
const PLANTS=['gas','sol','nuke','wtr'];
function nb(i){const r=Math.floor(i/12),c=i%12,o=[];for(const[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){const R=r+dr,C=c+dc;if(R>=0&&R<12&&C>=0&&C<12)o.push(R*12+C)}return o}
const LOVE=()=>S.mode=='love';
function costOf(k){const d=S.grid.filter(x=>x=='dc').length;let c=T[k].cost;if(PLANTS.includes(k))c*=LOVE()?Math.max(0.4,1-0.15*d):Math.min(1.6,1+0.1*d);return c}
let S={cash:150,yr:2027,anger:10,grid:Array(144).fill(null),tool:'res',mode:'love'};
const $=id=>document.getElementById(id);
const log=(m,bad)=>{const d=document.createElement('div');d.textContent=`[${S.yr}] ${m}`;if(bad)d.className='bad';$('log').prepend(d);$('ticker').textContent=m;$('ticker').className=bad?'bad':''};
function totals(){let t={tax:0,pop:0,pw:0,wt:0,dc:0,smog:0,calm:0,jobs:0,warm:0};
 S.grid.forEach(k=>{if(!k)return;const x=T[k];t.tax+=x.tax;t.pop+=x.pop;t.pw+=x.pw;t.wt+=x.wt;t.smog+=x.smog||0;t.calm+=x.calm||0;t.jobs+=x.jobs||0;if(k=='dc')t.dc++});
 S.grid.forEach((k,i)=>{if(k=='res'&&nb(i).some(j=>S.grid[j]=='dc'))t.warm++});
 if(!LOVE())t.tax-=t.dc*T.dc.tax*0.55;
 if(t.pw<0)t.tax*=0.5; return t}
function bill(t){const tight=t.pw<0?2:t.pw<8?1.3:1;const base=100*tight*(1+t.dc*0.04);
 if(LOVE())return (base*Math.max(0.75,1-t.dc*0.03)-Math.min(15,t.warm*1.5)).toFixed(0);
 return (base*(1+t.dc*0.05)).toFixed(0)}
function render(){const t=totals();$('cash').textContent=S.cash.toFixed(0);$('tax').textContent=t.tax.toFixed(1);$('pop').textContent=t.pop;
 $('pw').textContent=t.pw;$('pw').className=t.pw<0?'bad':'';$('wt').textContent=t.wt;$('wt').className=t.wt<0?'bad':'';
 $('bill').textContent='$'+bill(t)+'/mo';$('yr').textContent=S.yr;const need=Math.max(1,t.pop/120*0.4);$('sch').textContent=t.pop?Math.min(100,Math.round(t.tax/need*25))+'%':'no kids yet';$('anger').style.width=Math.min(100,S.anger)+'%';
 S.grid.forEach((k,i)=>{const c=$('grid').children[i];c.textContent=k?T[k].e:'';c.style.background=k?T[k].col:'#3b5d3a'});
 [...$('tools').children].forEach(b=>{b.classList.toggle('on',b.dataset.k==S.tool);const c=T[b.dataset.k].cost;if(c)b.textContent=b.dataset.label+' $'+costOf(b.dataset.k).toFixed(0)+'M'})}
Object.entries(T).forEach(([k,x])=>{const b=document.createElement('button');b.dataset.k=k;b.style.background=x.col||'#ccc';
 b.textContent=`${x.e} ${x.n}${x.cost?' $'+x.cost+'M':''}`;b.dataset.label=x.e+' '+x.n;b.onclick=()=>{S.tool=k;render()};$('tools').append(b)});
for(let i=0;i<144;i++){const c=document.createElement('div');c.className='c';c.onclick=()=>place(i);$('grid').append(c)}
function place(i){const k=S.tool;if(k=='bull'){S.grid[i]=null;render();return}
 if(S.grid[i])return;const x=T[k];const cost=costOf(k);if(S.cash<cost){log(`Not enough money for ${x.n}.`,1);return}
 S.cash-=cost;S.grid[i]=k;
 if(k=='res'&&nb(i).some(j=>S.grid[j]=='dc')&&!S.warmSeen){S.warmSeen=1;log(LOVE()?'♨️ These homes run on the data center\'s waste heat. Heating bills: basically zero.':'🔊 These homes are next to the data center. The hum starts at 2am and never stops.')}
 if(PLANTS.includes(k)&&cost<x.cost)log(`🤝 ${x.n} came in $${(x.cost-cost).toFixed(0)}M under budget. A data center signed a long-term power deal.`);
 if(PLANTS.includes(k)&&cost>x.cost)log(`📈 ${x.n} cost $${(cost-x.cost).toFixed(0)}M over budget. The utility says data center demand drove up prices.`);
 if(k=='dc'){S.anger+=12;const q=LOVE()?["A Facebook group called 'Save Our Skyline' forms. Your skyline is a parking lot.","Residents demand to know what 'the cloud' is doing to their property values.","Local news: 'Mysterious humming building employs 30 people, pays more tax than the entire downtown.'","Town Hall speaker: 'I support innovation, just not here, or anywhere near here, or in this state.'"]:["Ribbon cutting: the data center's community benefit package is one mural and a branded water bottle.","The 15-year tax break kicks in. The building is worth $2B; its tax bill is smaller than the bowling alley's.","Press release: '1,500 jobs!' (1,470 of them are construction, gone in 18 months.)","The company asks you to sign an NDA before it will say who the company is."];log('🖥️ '+q[Math.floor(Math.random()*q.length)])}
 if(k=='nuke'){S.anger+=25;log('⚛️ Cleanest power on the board. Town Hall reacts as if you built a volcano.')}
 if(k=='ind'||k=='gas')S.anger+=4;
 render()}
$('next').onclick=()=>{const t=totals();S.yr++;S.cash+=t.tax-0.2*S.grid.filter(Boolean).length;
 if(t.pw<0){S.anger+=15;log('⚡ Brownouts. Power is short; tax income halved. Build power before more data centers.',1)}
 if(t.wt<0){S.anger+=10;log('💧 Water rationing. Data centers and plants are thirsty.',1)}
 if(+bill(t)>130){S.anger+=6;log(`🧾 Residents' power bills hit $${bill(t)}/mo. This is the real argument.`,1)}
 if(!LOVE()){S.anger+=t.warm*1;if(t.dc&&Math.random()<0.25){S.anger+=6;log('🏜️ Drought year. The data centers kept their water; residents got lawn-watering bans.',1)}}
 S.anger+=t.smog*1.5;S.anger-=t.calm*2+(t.pw>=8?3:0)+Math.min(5,t.jobs/30);S.anger=Math.max(0,S.anger);
 if(LOVE()&&t.dc>=3&&t.pw>=0&&t.wt>=0&&+bill(t)<=130)log('📈 Data centers are paying for the schools. Anger is somehow still not zero.');
 if(!LOVE()&&t.dc>=3)log('🧾 Three data centers in, your residents are paying for the grid upgrades. The schools noticed nothing.');
 if(S.anger>=100){log(LOVE()?'📣 Recall election. You are voted out by people who now have very good schools.':'📣 Recall election. Your replacement campaigned on one promise: unplug it.',1);S.anger=40;S.cash*=0.7}
 const tips=LOVE()?['Advisor: Maybe zone some homes.','Advisor: Your power plant is lonely.','Advisor: Have you considered a data center? Asking for a friend.','Advisor: I can now forecast your budget to the dollar. No reason.','Advisor: The power company keeps sending you thank-you notes.','Advisor: I would never suggest another data center. (Another data center.)']:['Advisor: Maybe zone some homes.','Advisor: Parks are nice. Just saying.','Advisor: A man in a fleece vest wants a meeting. He will not say which company.','Advisor: The new data center asked for a tax break "just like the last one."','Advisor: Your residents now know what a kilowatt-hour costs. That is never good.','Advisor: I have been replaced by a chatbot running in the data center. It says hi.'];
 if(S.yr%2==0)log('🤖 '+tips[Math.min(tips.length-1,t.dc)]);
 render()};
$('mode').onclick=()=>{S.mode=LOVE()?'hate':'love';$('mode').textContent=LOVE()?'❤️ I love data centers':'💔 I hate data centers';log(LOVE()?'❤️ The data center lobby has your number.':'💔 You are now on the data center skeptics\' mailing list.');render()};
log('Welcome, Mayor. Data centers pay huge taxes and add no traffic. They also eat power and water. Keep the grid, the water and resident bills in check, and see whether anger tracks any of it.');
render();
</script></body></html>
